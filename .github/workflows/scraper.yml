name: Cricket Scraper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  ACTIONS_CACHE_NODE_MODULES: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node index.js

      - name: Commit playlist + lockfile
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add playlist.m3u playlist-status.json package-lock.json
          git commit -m "Update playlist" || echo "No changes"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sambath-creator/sports-enthusiast.git main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sambath-creator/sports-enthusiast.git
